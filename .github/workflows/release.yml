name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Publish
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/GitRemoteSvn -c Release -r ${{ matrix.rid }} -p:Version="$version" -o out
          cp LICENSE README.md out/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/* -DestinationPath git-remote-svn-${{ github.ref_name }}-${{ matrix.rid }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf git-remote-svn-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz -C out .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: git-remote-svn-${{ github.ref_name }}-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum git-remote-svn-* > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" git-remote-svn-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
