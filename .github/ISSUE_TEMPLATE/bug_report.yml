name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please remove server names, paths or credentials you do not want public.
        Security problems go to the private report instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The exact command you ran and what you saw (paste the full output).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Ideally with a small local repository (`svnadmin create` + `file://`).
  - type: dropdown
    id: data-safety
    attributes:
      label: Was any work lost or overwritten?
      description: A missing revision, a local commit gone, someone's change reverted in SVN...
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: git-remote-svn version
      placeholder: release tag or commit
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Output of `git --version`, `svn --version --quiet`, and your OS.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Session log
      description: Contents of the file in `.git/svn/log/` printed with the error, if any.
      render: text
